<!DOCTYPE html>
<html>
<head>
    <title>App 2 — Bucket Browser</title>
</head>
<body>
    <h1>Hello from App 2</h1>
    <p>Endpoint: <code>{{ endpoint }}</code></p>
    <p>Bucket: <code>{{ bucket }}</code></p>

    <h2>Upload a file</h2>
    <form method="post" action="{{ url_for('upload') }}" enctype="multipart/form-data">
        <input type="file" name="file" required />
        <button type="submit">Upload</button>
    </form>

    <h2>Objects</h2>
    {% if objects %}
        <ul>
        {% for name in objects %}
            <li>
                {{ name }}
                <form method="post" action="{{ url_for('delete', name=name) }}" style="display:inline">
                    <button type="submit">Delete</button>
                </form>
            </li>
        {% endfor %}
        </ul>
    {% else %}
        <p><em>Bucket is empty.</em></p>
    {% endif %}
</body>
</html>
